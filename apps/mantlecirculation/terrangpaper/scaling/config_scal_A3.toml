## Paper-A strong-scaling sweep: A3 physics, incompressible, 10 timesteps.
## Ra 7e3 from reference viscosity 2.459983e25, shell 1.22..2.22 from radii
## 3527020/6418020, T in 0..3500 K -- all passed on the command line.
## Mesh/subdomain levels, iteration counts and tolerances also come from the CLI.

viscosity-law="fk-benchmark"
viscosity-rmu=20

velocity-bc-cmb="freeslip"
velocity-bc-surface="noslip"
temperature-bc-value-cmb=1.0
temperature-bc-value-surface=0.0

initial-temperature-profile="conductive"
initial-temperature-sph-degree=3
initial-temperature-sph-order=2
perturbation-amplitude=0.01

dt-scaling=0.5
## NOTE: on the merged binary t-end is in Ma (it was nondimensional time on the
## original binary). t-end=1.0 stopped the run after 3 steps. Set it out of reach
## so --max-timesteps 10 is the only stopping criterion.
t-end=1e9
max-timesteps=10
energy-solver="ev"
energy-substeps=1

stokes-viscous-pc-num-vcycles=1
stokes-viscous-pc-cheby-order=2
stokes-viscous-pc-num-power-iterations=10
stokes-viscous-pc-agglom-factors=[]

outdir-overwrite=1
output-frequency=9
ev-dump-nu-h=false
